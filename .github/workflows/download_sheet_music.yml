name: Download Sheet Music

on:
  workflow_dispatch:
    inputs:
      url:
        description: "MuseScore URL (e.g. https://musescore.com/user/33306646/scores/6781025)"
        required: true
      type:
        description: "Output format"
        required: true
        default: "pdf"
        type: choice
        options:
          - pdf
          - midi
          - mp3
      output_name:
        description: "Optional custom artifact name suffix"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 xvfb python3-tk python3-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build

      - name: Download sheet music
        id: download
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            rm -rf ./downloaded_files
            mkdir -p ./downloaded_files
            node ./dist/cli.js -i "${{ github.event.inputs.url }}" -t ${{ github.event.inputs.type }} -o ./downloaded_files -v
            exit_code=$?
            echo "::endgroup::"
            if [ $exit_code -eq 0 ]; then
              break
            fi
            if [ $attempt -eq 3 ]; then
              exit 1
            fi
            echo "Retrying in 15s…"
            sleep 15
          done
          echo "files=$(ls -1 ./downloaded_files | head -c 8000)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheet-music-${{ github.run_id }}${{ github.event.inputs.output_name && '-' }}${{ github.event.inputs.output_name }}
          path: downloaded_files/*
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## ✅ Download Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ github.event.inputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Format:** ${{ github.event.inputs.type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Files:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.download.outputs.files }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact from the **Artifacts** section above." >> "$GITHUB_STEP_SUMMARY"
